name: Deploy private blog source

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: cheondi/cheondi-blog-source
          ref: master
          ssh-key: ${{ secrets.BLOG_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        working-directory: source
        run: bundle install --jobs 4 --retry 3

      - name: Validate content and deployment boundary
        shell: pwsh
        working-directory: source
        run: ./scripts/validate-content.ps1

      - name: Build Jekyll
        working-directory: source
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Validate generated site
        working-directory: source
        run: node scripts/validate-build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
