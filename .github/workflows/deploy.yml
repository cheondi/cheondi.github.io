name: Deploy private blog source

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 00:00 UTC is 09:00 KST.
    - cron: '0 0 20 8 *'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Allow the one-time scheduled release or a manual deployment
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(date -u +%Y-%m-%d)" == "2026-08-20" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: cheondi/cheondi-blog-source
          ref: master
          ssh-key: ${{ secrets.BLOG_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        working-directory: source
        run: bundle install --jobs 4 --retry 3

      - name: Validate content and deployment boundary
        shell: pwsh
        working-directory: source
        run: ./scripts/validate-content.ps1

      - name: Build Jekyll
        working-directory: source
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Validate generated site
        working-directory: source
        run: node scripts/validate-build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
